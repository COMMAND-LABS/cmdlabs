# Docker Compose configuration for Kalygo ingest microservices
# Usage: docker-compose -f docker-compose.ingest.yml up

services:
  qna-ingest-function:
    image: node:18-alpine
    container_name: kalygo3-qna-ingest-function
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - ./kalygo3-qna-ingest-cloud-function:/app
      - /app/node_modules
      - /app/build
    environment:
      - NODE_ENV=development
      - PORT=8080
    command: sh -c "npm install && npm run watch"
    networks:
      - agent-network
    restart: unless-stopped

  txt-ingest-function:
    image: node:18-alpine
    container_name: kalygo3-txt-ingest-function
    working_dir: /app
    ports:
      - "8081:8080"
    volumes:
      - ./kalygo3-txt-ingest-cloud-function:/app
      - /app/node_modules
      - /app/build
    environment:
      - NODE_ENV=development
      - PORT=8080
    command: sh -c "npm install && npm run watch"
    networks:
      - agent-network
    restart: unless-stopped

networks:
  agent-network:
    external: true

