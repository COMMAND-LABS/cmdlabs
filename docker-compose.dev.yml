# Docker Compose version is obsolete in newer versions, but kept for compatibility
# version: "3.8"

services:
  api:
    build:
      context: ./cmdlabs-api
      dockerfile: Dockerfile.dev
    container_name: cmdlabs-api
    ports:
      - "4000:4000"
      - "5678:5678" # Debug port
    volumes:
      - ./cmdlabs-api:/code
    env_file:
      - ./cmdlabs-api/.env
    environment:
      - PYTHONPATH=/code
      - ENVIRONMENT=development
      # Container runs as root; this tells Claude Code it's in an isolated
      # sandbox so bypass-permissions mode is allowed.
      - IS_SANDBOX=1

    command: uvicorn src.main:app --host 0.0.0.0 --port 4000 --proxy-headers --reload
    networks:
      - agent-network
    restart: unless-stopped

  embeddings-api:
    build:
      context: ./cmdlabs-embeddings-api
      dockerfile: Dockerfile.dev
    container_name: cmdlabs-embeddings-api
    ports:
      - "9100:9100"
      - "5679:5678" # Debug port
    volumes:
      - ./cmdlabs-embeddings-api:/code
    environment:
      - PYTHONPATH=/code
    command: uvicorn src.main:app --host 0.0.0.0 --port 9100 --proxy-headers --reload
    networks:
      - agent-network
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: cmdlabs-test-pg
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
      - POSTGRES_DB=kalygo_test
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - agent-network
    restart: unless-stopped

  # Stripe webhook forwarder for local development.
  #
  # Behind the "stripe" profile so it does NOT start with a plain `up` — run it
  # only when you are testing payments:
  #
  #   docker compose -f docker-compose.dev.yml --profile stripe up stripe-cli
  #
  # It prints `Ready! Your webhook signing secret is whsec_...`. Copy that into
  # cmdlabs-api/.env as STRIPE_WEBHOOK_SECRET, then recreate the api container
  # (`up -d api`) — compose reads env_file at container creation, so a restart
  # will not pick it up.
  #
  # Two things that are easy to get wrong:
  #   - forward-to uses the container hostname `cmdlabs-api`, not localhost;
  #     inside this container localhost is the CLI itself.
  #   - the key, the price id, and the webhook secret must all belong to the
  #     same Stripe account (a Sandbox is a separate account from test mode).
  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: cmdlabs-stripe-cli
    profiles: ["stripe"]
    env_file:
      - ./cmdlabs-api/.env
    entrypoint: /bin/sh
    # $$ escapes compose interpolation so the shell inside the container is the
    # one that expands STRIPE_SECRET_KEY, which arrives via env_file.
    command: -c 'stripe listen --api-key "$$STRIPE_SECRET_KEY" --forward-to http://cmdlabs-api:4000/api/billing/webhook'
    networks:
      - agent-network
    depends_on:
      - api

networks:
  agent-network:
    external: true

volumes:
  pgdata:
