# Docker Compose version is obsolete in newer versions, but kept for compatibility
# version: "3.8"

services:
  api:
    build:
      context: ./cmdlabs-api
      dockerfile: Dockerfile.dev
    container_name: cmdlabs-api
    ports:
      - "4000:4000"
      - "5678:5678" # Debug port
    volumes:
      - ./cmdlabs-api:/code
    env_file:
      - ./cmdlabs-api/.env
    environment:
      - PYTHONPATH=/code
      - ENVIRONMENT=development

    command: uvicorn src.main:app --host 0.0.0.0 --port 4000 --proxy-headers --reload
    networks:
      - agent-network
    restart: unless-stopped

  embeddings-api:
    build:
      context: ./cmdlabs-embeddings-api
      dockerfile: Dockerfile.dev
    container_name: cmdlabs-embeddings-api
    ports:
      - "9100:9100"
      - "5679:5678" # Debug port
    volumes:
      - ./cmdlabs-embeddings-api:/code
    environment:
      - PYTHONPATH=/code
    command: uvicorn src.main:app --host 0.0.0.0 --port 9100 --proxy-headers --reload
    networks:
      - agent-network
    restart: unless-stopped

  agent-api:
    build:
      context: ./cmdlabs-agent-api
      dockerfile: Dockerfile.dev
    container_name: cmdlabs-agent-api
    ports:
      - "4100:4100"
    volumes:
      - ./cmdlabs-agent-api:/code
    env_file:
      - ./cmdlabs-agent-api/.env
    environment:
      - PYTHONPATH=/code
    command: uvicorn src.main:app --host 0.0.0.0 --port 4100 --proxy-headers --reload
    networks:
      - agent-network
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: cmdlabs-test-pg
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
      - POSTGRES_DB=kalygo_test
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - agent-network
    restart: unless-stopped

networks:
  agent-network:
    external: true

volumes:
  pgdata:
